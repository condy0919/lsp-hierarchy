name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '29.1'
          - '30.2'
          - 'snapshot'
        lsp_objects: [hash-table, plist]
        lsp_version: [latest]
        include:
          - emacs_version: '29.1'
            lsp_objects: hash-table
            lsp_version: '9.0.0'
          - emacs_version: '29.1'
            lsp_objects: plist
            lsp_version: '9.0.0'
    env:
      LSP_HIERARCHY_LSP_MODE_VERSION: ${{ matrix.lsp_version }}

    steps:
    - uses: actions/checkout@v4

    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - uses: emacs-eask/setup-eask@master
      with:
        version: 'snapshot'

    # LSP accessors depend on this setting at compile time.  Each matrix
    # job installs and compiles its dependencies with one representation.
    - name: Select plist protocol objects
      if: matrix.lsp_objects == 'plist'
      run: echo "LSP_USE_PLISTS=true" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        eask install-deps --dev

    - name: Verify minimum lsp-mode release
      if: matrix.lsp_version == '9.0.0'
      run: |
        eask exec emacs --batch --eval "
          (progn
            (require 'lisp-mnt)
            (with-temp-buffer
              (insert-file-contents (locate-library \"lsp-mode.el\" t))
              (unless (equal (lm-header \"version\") \"9.0.0\")
                (error \"Expected lsp-mode 9.0.0, got %s\" (lm-header \"version\")))))"

    - name: Compile
      run: |
        eask compile

    - name: Lint
      run: |
        eask lint package

    - name: Test
      run: |
        eask test ert ./test/lsp-hierarchy-test.el
