name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '29.1'
          - '30.2'
          - 'snapshot'
        lsp_objects: [hash-table, plist]

    steps:
    - uses: actions/checkout@v4

    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - uses: emacs-eask/setup-eask@master
      with:
        version: 'snapshot'

    # LSP accessors depend on this setting at compile time.  Each matrix
    # job installs and compiles its dependencies with one representation.
    - name: Select plist protocol objects
      if: matrix.lsp_objects == 'plist'
      run: echo "LSP_USE_PLISTS=true" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        eask install-deps --dev

    - name: Compile
      run: |
        eask compile

    - name: Lint
      run: |
        eask lint package

    - name: Test
      run: |
        eask test ert ./test/lsp-hierarchy-test.el
